    <!-- Boxiocns CDN Link -->
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
   </head>
<body>
  <!-- Sidebar Start -->
  <div class="sidebar">
    <div class="logo-details">
      <i class='bx bxl-c-plus-plus'></i>
      <span class="logo_name">Collegium</span>
    </div>
    <ul class="nav-links">
      <li>
        <a href="dashboard-admin.html">
          <i class="fa-solid fa-house"></i>
          <span class="link_name">Dashboard</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="dashboard-admin.html">Dashboard</a></li>
        </ul>
      </li>
      <li>
        <div class="iocn-link">
          <a href="students-list.html">
            <i class="fa-solid fa-user"></i>
            <span class="link_name">Students</span>
          </a>
        </div>
        <ul class="sub-menu">
          <li><a class="link_name" href="students-list.html">Students</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
          <i class="fa-regular fa-folder-open"></i>
          <span class="link_name">Courses</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Courses</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
          <i class="fa-regular fa-pen-to-square"></i>
          <span class="link_name">Requests</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Requests</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
          <i class="fa-solid fa-utensils"></i>
          <span class="link_name">Meals</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Meals</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
            <i class="fa-regular fa-calendar"></i>
            <span class="link_name">Calendar</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Calendar</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
          <i class="fa-solid fa-dollar-sign"></i>
          <span class="link_name">Payments</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Payments</a></li>
        </ul>
      </li>
      <li>
        <a href="#">
          <i class="fa-regular fa-bookmark"></i>
          <span class="link_name">Library</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#">Library</a></li>
        </ul>
      </li>
      <li>
        <a href="#" id="logout-btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span class="link_name">Log Out</span>
        </a>
        <ul class="sub-menu blank">
          <li><a class="link_name" href="#" id="logout-btn">Log Out</a></li>
        </ul>
      </li>
      <li>
        <div class="profile-details">
          <a href="" id="profile">
            <div class="profile-content">
              <img src="" alt="profileImg">
            </div>
            <div class="name-job">
              <div class="profile_name"></div>
              <div class="job"></div>
            </div>
          </a>
        </div>
      </li>
    </ul>
  </div>
  <!-- Sidebar End -->

  <section class="home-section">
    <div class="home-content">
      <i class='bx bx-menu' ></i>
      <span class="text">Profile</span>
    </div>
    <div id="content-area">
        <!-- اینجا محتوای هر صفحه لود میشه -->
        <div class="profile-container">
            <h2>User Profile</h2>
            <div class="profile-card">
              <div class="profile-pic-wrapper">
                <img src="" alt="User Picture" class="profile-pic">
                <!-- Hidden file input for photo change -->
                <input type="file" id="photo-input" class="hidden" accept="image/*">
                <button type="button" id="change-photo-btn" class="hidden">Change Photo</button>
              </div>
              <form action="#" method="POST" class="profile-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" value="" disabled>
                
                <label for="username">Username (National ID):</label>
                <input type="number" id="username" name="username" value="" disabled>

                <label for="major" id="major-lable">Field of Study:</label>
                <input type="text" id="major" name="major" value="" disabled>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value="" disabled>
                
                <label for="birthdate">Birth Date:</label>
                <input type="date" id="birthdate" name="birthdate" value="" disabled>
                
                <label for="mobile">Phone Number:</label>
                <input type="tel" id="mobile" name="mobile" value="" disabled>
                
                <div class="button-group">
                  <button type="button" id="edit-btn">Edit</button>
                  <button type="submit" id="save-btn" class="hidden">Save</button>
                  <button type="button" id="cancel-btn" class="hidden">Cancel</button>
                  <button type="button" id="delete-account-btn">Delete Account</button>
                </div>
              </form>
            </div>
          </div>
    </div>
  </section>
  
  <script src="../js/main-page.js" type="module"></script>
  <script src="../js/profile.js" type="module"></script>
</body>
</html>
